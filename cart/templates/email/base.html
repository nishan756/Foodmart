<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Foodmart{% endblock %}</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            font-family: Arial, Helvetica, sans-serif;
        }

        .email-wrapper {
            width: 100%;
            padding: 30px 0;
        }

        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
        }

        /* Header */
        .header {
            padding: 20px 30px;
            background: #198754;
            text-align: center;
        }

        .logo {
            color: #ffffff;
            font-size: 28px;
            font-weight: bold;
            text-decoration: none;
        }

        /* Content */
        .content {
            padding: 30px;
            color: #333333;
            line-height: 1.6;
        }

        /* Footer */
        .footer {
            padding: 20px 30px;
            background: #f8f9fa;
            text-align: center;
            color: #777777;
            font-size: 13px;
        }

        .footer a {
            color: #198754;
            text-decoration: none;
        }

        {% block style %}

        {% endblock style %}
    </style>

</head>

<body>

<div class="email-wrapper">

    <div class="email-container">

        <!-- Header -->
        <div class="header">
            <a href="{% url 'home' %}" class="logo">
                Foodmart
            </a>
        </div>


        <!-- Email Content -->
        <div class="content">
            {% block content %}
            {% endblock content %}
        </div>


        <!-- Footer -->
        <div class="footer">
            <p>
                &copy; {% now "Y" %} Foodmart. All rights reserved.
            </p>

            <p>
                This is an automated email. Please do not reply to this email.
            </p>

            <p>
                <a href="{% url 'home' %}">Foodmart</a>
                &nbsp; | &nbsp;
                <a href="#">Privacy Policy</a>
                &nbsp; | &nbsp;
                <a href="#">Contact Us</a>
            </p>
        </div>

    </div>

</div>

</body>
</html>
